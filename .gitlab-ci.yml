stages:
  - lint
  - security
  - test
  - build

# -------------------------------------------------------------------
# Stage 1: Code Formatting & Quality Check
# -------------------------------------------------------------------
lint-backend:
  stage: lint
  image: python:3.11-slim
  script:
    - cd backend
    - pip install flake8 black
    - black --check .
    - flake8 .

lint-frontend:
  stage: lint
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint --if-present

# -------------------------------------------------------------------
# Stage 2: Security Linting & Secret Detection
# -------------------------------------------------------------------
secret-detection:
  stage: security
  image: python:3.11-slim
  script:
    - pip install bandit
    - bandit -r backend/

# -------------------------------------------------------------------
# Stage 3: Automated Testing & Database Migrations
# -------------------------------------------------------------------
test-backend:
  stage: test
  image: python:3.11-slim
  variables:
    DATABASE_URL: $TEST_DATABASE_URL
  script:
    - cd backend
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - alembic upgrade head   # Runs database migrations check
    - pytest

# -------------------------------------------------------------------
# Stage 4: Build Verification
# -------------------------------------------------------------------
build-frontend:
  stage: build
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/